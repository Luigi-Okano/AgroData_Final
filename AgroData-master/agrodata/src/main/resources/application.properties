# ===== Banco de dados (credenciais via variáveis de ambiente) =====
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/agrodata?serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ===== Hibernate / JPA =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===== Segurança =====
# Obrigatório: mínimo 32 caracteres. Gere com: openssl rand -base64 48
agrodata.security.jwt.secret=${JWT_SECRET}
agrodata.security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
# Chave AES-256 (Base64, 32 bytes) que criptografa dados pessoais no banco. Gere com: openssl rand -base64 32
# ATENÇÃO: perder esta chave = perder os dados pessoais criptografados.
agrodata.security.data-key=${DATA_ENCRYPTION_KEY}
# Origens CORS permitidas, separadas por vírgula (vazio = apenas mesma origem)
agrodata.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
# Primeiro ADMIN (criado só se a tabela USUARIO estiver vazia)
agrodata.security.admin.username=${ADMIN_USERNAME:}
agrodata.security.admin.password=${ADMIN_PASSWORD:}

# ===== Não vazar detalhes de erro =====
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false
server.servlet.session.cookie.http-only=true

# ===== Integração com o sistema de irrigação =====
# Se definido, cada comando de irrigação é enviado por POST JSON a esta URL.
# Se vazio, o sistema de irrigação deve consultar GET /api/irrigacao/comandos/pendentes
agrodata.irrigacao.webhook-url=${IRRIGACAO_WEBHOOK_URL:}
agrodata.irrigacao.webhook-token=${IRRIGACAO_WEBHOOK_TOKEN:}
# Above this chance, dry plots wait for rain instead of creating irrigation commands.
agrodata.irrigacao.limite-chuva=${RAIN_PROBABILITY_THRESHOLD:65}

# ===== Simulação =====
# Leituras iniciais por sensor (1 a 2.000); depois, uma nova leitura a cada minuto até 2.000.
agrodata.simulacao.leituras-por-talhao=${LEITURAS_POR_TALHAO:48}
